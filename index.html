<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caja - Antojitos</title>
  <style>
    :root {
      --bg: #0f0f14; --bg2: #16161e; --sidebar-bg: #0a0a10; --side-card: #1a1a26;
      --border-def: #323246; --accent-purp: #8b5cf6; --accent-ind: #e11d48;
      --text-pri: #ebebf5; --text-mut: #787891; --btn-bg: #20202d; --btn-fg: #bebed2;
      --btn-bor: #373750; --sel-pl-bg: #be123c; --sel-gs-bg: #15803d;
      --sel-ex-bg: #0e7490; --sel-bb-bg: #581c87;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }

    body {
      background-color: var(--bg); color: var(--text-pri); display: flex; flex-direction: row; height: 100vh; overflow: hidden;
    }

    @media (max-width: 850px) {
      body { flex-direction: column; overflow-y: auto; height: auto; }
      .sidebar { width: 100% !important; border-left: none !important; border-top: 2px solid var(--border-def); height: auto !important; }
      .main-content { height: auto !important; overflow: visible !important; }
      .sb-body { max-height: 400px; }
    }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 20px; height: 100vh; }
    .sidebar { width: 350px; background-color: var(--sidebar-bg); border-left: 1px solid var(--border-def); display: flex; flex-direction: column; height: 100vh; }

    .header-title { font-size: 22px; font-weight: bold; color: #f43f5e; margin-bottom: 15px; text-align: center; font-family: 'Georgia', serif;}
    .section { margin-bottom: 20px; }
    .section-title { font-size: 14px; font-weight: bold; color: #a0a0be; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
    .section-title::before { content: ""; display: inline-block; width: 4px; height: 16px; background-color: var(--accent-ind); }
    .hint { font-size: 13px; color: #fbbf24; margin-bottom: 10px; background: #27272a; padding: 6px 10px; border-radius: 4px; border-left: 3px solid #fbbf24;}

    .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn { background: var(--btn-bg); color: var(--btn-fg); border: 1px solid var(--btn-bor); padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: 0.2s; }

    .btn:hover { background: #2d2d3f; }
    .btn.active-pl { background: var(--sel-pl-bg); color: white; border-color: #fda4af; font-weight: bold; }
    .btn.active-gs { background: var(--sel-gs-bg); color: white; border-color: #86efac; font-weight: bold; }
    .btn.active-ex { background: var(--sel-ex-bg); color: white; border-color: #22d3ee; font-weight: bold; }
    .btn.active-bb { background: var(--sel-bb-bg); color: white; border-color: #c084fc; font-weight: bold; }
    hr { border: none; border-top: 1px solid var(--border-def); margin: 20px 0; }

    .bottom-bar { background: #0c0c12; border-top: 1px solid var(--border-def); padding: 15px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; position: sticky; bottom: 0; }
    .price-box { border: 2px solid var(--accent-ind); background: #14142a; padding: 8px 15px; border-radius: 6px; flex-grow: 1; }
    .price-label { font-size: 11px; color: #94a3dc; }
    .price-value { font-size: 24px; font-weight: bold; color: #f43f5e; }

    /* Controles de Cantidad */
    .qty-box { display: flex; align-items: center; background: #14142a; border: 2px solid var(--border-def); border-radius: 6px; overflow: hidden; height: 100%;}
    .btn-qty { background: #20202d; color: white; border: none; padding: 12px 15px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s;}
    .btn-qty:hover { background: #373750; }
    .qty-val { padding: 0 15px; font-size: 18px; font-weight: bold; min-width: 40px; text-align: center; color: white;}

    .btn-add { background: var(--accent-ind); color: white; border: none; padding: 12px 20px; font-size: 14px; font-weight: bold; border-radius: 6px; cursor: pointer; flex-grow: 2; height: 100%;}
    .btn-add:hover { background: #be123c; }

    .sb-header, .sb-footer { padding: 15px; background: #08080e; border-bottom: 1px solid var(--border-def); }
    .sb-body { padding: 15px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .sb-body::-webkit-scrollbar { width: 6px; }
    .sb-body::-webkit-scrollbar-thumb { background: var(--border-def); border-radius: 10px; }

    .cart-item { background: var(--side-card); border: 1px solid #373750; padding: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .cart-item-details { display: flex; flex-direction: column; gap: 4px; }
    .cart-item-title { font-size: 14px; font-weight: bold; color: #f43f5e; }
    .cart-item-desc { font-size: 11px; color: var(--text-mut); max-width: 180px; line-height: 1.3;}
    .cart-item-price { color: #818cf8; font-weight: bold; font-size: 14px; }
    .btn-del { background: none; border: none; color: #f87171; cursor: pointer; font-weight: bold; padding: 5px; }

    .total-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .total-val { font-size: 24px; font-weight: bold; color: #4ade80; }
    .btn-save { background: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 8px;}
    .btn-clear { background: #28283a; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; margin-bottom: 8px;}
    .btn-corte { background: #059669; color: white; border: none; padding: 10px; width: 100%; border-radius: 4px; cursor: pointer; font-weight: bold;}

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; padding: 10px; }
    .modal { background: var(--bg2); border: 1px solid var(--border-def); width: 600px; max-width: 100%; border-radius: 8px; padding: 20px; display: flex; flex-direction: column; max-height: 90vh; }
    .historial-area { background: var(--bg); border: 1px solid var(--border-def); padding: 15px; border-radius: 4px; color: var(--text-pri); font-family: monospace; white-space: pre-wrap; overflow-y: auto; flex: 1; font-size: 13px; margin: 10px 0;}
  </style>
</head>
<body>

<div class="main-content">
  <div class="header-title">Calculadora</div>
  <div class="section"><div class="section-title">1. PLATILLO</div><div class="btn-grid" id="grid-platillos"></div></div>
  <div class="hint" id="hint-text">Selecciona un platillo para ver sus reglas y precios.</div>
  <hr>

  <div class="section">
    <div class="section-title">2. GUISADOS Y ESPECIALES</div>
    <div class="btn-grid" id="grid-guisados"></div>
  </div><hr>

  <div class="section"><div class="section-title">3. SALSA</div><div class="btn-grid" id="grid-salsas"></div></div><hr>

  <div class="section">
    <div class="section-title" style="justify-content: space-between;">
      <span>4. EXTRAS / INCLUYE</span>
      <button class="btn" style="background:#0e7490; color:white; border:none; padding:4px 8px; font-size:11px;" onclick="agregarTodosExtras()">+ Agregar todo</button>
    </div>
    <div class="btn-grid" id="grid-extras"></div>
  </div><hr>

  <div class="section"><div class="section-title">5. BEBIDA</div><div class="btn-grid" id="grid-bebidas"></div></div>

  <div class="bottom-bar">
    <div class="price-box"><div class="price-label">Precio Unitario</div><div class="price-value" id="lbl-precio">—</div></div>

    <div class="qty-box">
      <button class="btn-qty" onclick="cambiarCantidad(-1)">-</button>
      <div class="qty-val" id="lbl-cantidad">1</div>
      <button class="btn-qty" onclick="cambiarCantidad(1)">+</button>
    </div>

    <button class="btn-add" onclick="agregarItem()">+ Agregar al pedido</button>
  </div>
</div>

<div class="sidebar">
  <div class="sb-header"><h3 style="font-size: 16px;">Pedido actual</h3><div class="hint" id="lbl-side-count" style="margin: 0; background:none; border:none; padding:0; color:var(--text-mut)">Sin productos</div></div>
  <div class="sb-body" id="sidebar-resumen"></div>
  <div class="sb-footer">
    <div class="total-row"><span style="color: var(--text-mut); font-size: 13px;">Total a cobrar</span><span class="total-val" id="lbl-side-total">$0.00</span></div>
    <button class="btn-save" onclick="guardarVenta()">Cobrar y Guardar ></button>
    <button class="btn-clear" onclick="limpiarPedido()">Limpiar pedido</button>
    <button class="btn-corte" onclick="abrirModalCorte()">Ver Corte del Día 📊</button>
  </div>
</div>

<div class="modal-overlay" id="modal-corte">
  <div class="modal">
    <div class="modal-header" style="display:flex; justify-content: space-between; align-items: center;"><h2>Historial del Día</h2><button onclick="cerrarModalCorte()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">✖</button></div>
    <div id="lbl-metricas" style="font-weight:bold; color:#4ade80; margin-top:10px;"></div>
    <div class="historial-area" id="area-historial"></div>
    <button class="btn-corte" onclick="hacerCorte()">Hacer corte del dia</button>
  </div>
</div>

<script>
  const PLATILLOS = ["Quesadilla", "Sope", "Gordita", "Gordita de puro guisado", "Pambazo", "Tostada", "Flautas (3pz)", "Taco", "Huarache"];

  const GUISADOS = [
    "Bistec", "Longaniza", "Campechano",
    "Quesillo / Oaxaca", "Tinga de pollo", "Tinga de res", "Champiñones",
    "Pancita", "Picadillo", "Flor de calabaza", "Huitlacoche", "Requesón",
    "Chicharrón", "Pata", "Papa con longaniza"
  ];

  const SALSAS  = ["Salsa verde", "Salsa roja"];
  const EXTRAS  = ["Lechuga", "Queso", "Quesillo", "Cilantro", "Cebolla", "Nopales", "Crema", "Frijoles"];
  const BEBIDAS = ["Coca-Cola 500ml $27", "Boing 500ml $25"];

  let state = {
    selPlatillo: null, selGuisados: [], selSalsas: [], selExtras: [], selBebida: null, precBebida: 0,
    itemsVenta: [], numVenta: 0, historial: [], cantidadActual: 1
  };

  function calcularPrecio(pl, gs) {
    if (!pl) return 0;

    let esCampechano = gs.includes("Campechano");
    let esBistec = gs.includes("Bistec");
    let esLonganiza = gs.includes("Longaniza");
    let esCarne = esBistec || esLonganiza;

    let guisadosNormales = gs.filter(g => !["Bistec", "Longaniza", "Campechano"].includes(g)).length;

    if (pl === "Flautas (3pz)") return 50;

    if (pl === "Taco") {
      if (esCampechano) return 47;
      if (esCarne) return 42;
      return 42;
    }

    if (pl === "Huarache") {
      if (esCampechano) return 82;
      if (esCarne) return 72;
      return 72;
    }

    if (pl === "Gordita de puro guisado") return 27;

    if (["Quesadilla", "Sope", "Gordita", "Pambazo"].includes(pl)) {
      if (esCampechano) return 42;
      if (esCarne) return 37;
    }

    if (guisadosNormales <= 1) return 22;
    return 22 + ((guisadosNormales - 1) * 5);
  }

  function cambiarCantidad(delta) {
    state.cantidadActual += delta;
    if (state.cantidadActual < 1) state.cantidadActual = 1;
    document.getElementById('lbl-cantidad').innerText = state.cantidadActual;
  }

  function onPlatillo(p) {
    state.selPlatillo = (state.selPlatillo === p) ? null : p;
    state.selGuisados = [];
    state.selExtras = [];

    const hint = document.getElementById('hint-text');

    if (state.selPlatillo === "Quesadilla" || state.selPlatillo === "Sope") {
      state.selExtras = ["Lechuga", "Queso"];
      hint.innerText = "$22 (1 guisado), +$5 extra. Especiales (Bistec/Longaniza) $37, Campechano $42 (Incluyen quesillo).";
    } else if (state.selPlatillo === "Gordita") {
      state.selExtras = ["Cilantro", "Cebolla", "Nopales", "Queso"];
      hint.innerText = "$22 (1 guisado), +$5 extra. Especiales $37, Campechano $42.";
    } else if (state.selPlatillo === "Gordita de puro guisado") {
      state.selExtras = ["Cilantro", "Cebolla", "Nopales", "Queso"];
      hint.innerText = "$27. Regla: SIN chicharrón.";
    } else if (state.selPlatillo === "Pambazo") {
      state.selExtras = ["Lechuga", "Queso", "Crema"];
      state.selGuisados = ["Papa con longaniza"];
      hint.innerText = "$22 (Base), +$5 extra. Especiales $37, Campechano $42.";
    } else if (state.selPlatillo === "Tostada") {
      state.selExtras = ["Frijoles", "Crema", "Queso", "Lechuga"];
      hint.innerText = "$22 (1 guisado), +$5 extra.";
    } else if (state.selPlatillo === "Flautas (3pz)") {
      state.selExtras = ["Lechuga", "Queso", "Crema"];
      hint.innerText = "$50 (3 piezas). Elegir relleno (Ej. Tinga de pollo o res).";
    } else if (state.selPlatillo === "Taco") {
      state.selExtras = ["Cilantro", "Cebolla", "Nopales", "Quesillo", "Queso"];
      hint.innerText = "Taco Bistec/Longaniza $42, Campechano $47.";
    } else if (state.selPlatillo === "Huarache") {
      state.selExtras = ["Frijoles", "Quesillo", "Cilantro", "Cebolla", "Nopales", "Queso"];
      hint.innerText = "Huarache Bistec/Longaniza $72, Campechano $82.";
    } else {
      hint.innerText = "Selecciona un platillo para ver sus reglas y precios.";
    }

    actualizarUI();
  }

  function onGuisado(g) {
    if (!state.selPlatillo) return;

    if (state.selPlatillo === "Gordita de puro guisado" && g === "Chicharrón") {
      return alert("El menú indica que la Gordita de Puro Guisado es SIN Chicharrón.");
    }

    if (state.selGuisados.includes(g)) {
      state.selGuisados = state.selGuisados.filter(x => x !== g);
      if (["Bistec", "Longaniza", "Campechano"].includes(g) && !["Taco", "Huarache"].includes(state.selPlatillo)) {
        state.selExtras = state.selExtras.filter(e => e !== "Quesillo");
      }
    } else {
      if (["Bistec", "Longaniza", "Campechano"].includes(g) && ["Quesadilla", "Sope", "Gordita", "Pambazo"].includes(state.selPlatillo)) {
        if (!state.selExtras.includes("Quesillo")) state.selExtras.push("Quesillo");
      }
      state.selGuisados.push(g);
    }
    actualizarUI();
  }

  function renderGrid(containerId, items, selCheckFunc, clickHandler, activeClass) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = `btn ${selCheckFunc(item) ? activeClass : ''}`;

      if(["Bistec", "Longaniza", "Campechano"].includes(item) && containerId === 'grid-guisados'){
        btn.style.border = "1px solid #f43f5e";
        if(!selCheckFunc(item)) btn.style.color = "#fda4af";
      }

      btn.innerText = item;
      btn.onclick = () => clickHandler(item);
      container.appendChild(btn);
    });
  }

  function actualizarUI() {
    renderGrid('grid-platillos', PLATILLOS, (i) => state.selPlatillo === i, onPlatillo, 'active-pl');
    renderGrid('grid-guisados', GUISADOS, (i) => state.selGuisados.includes(i), onGuisado, 'active-gs');
    renderGrid('grid-salsas', SALSAS, (i) => state.selSalsas.includes(i), (s) => {
      if (state.selSalsas.includes(s)) state.selSalsas = state.selSalsas.filter(x => x !== s);
      else state.selSalsas.push(s); actualizarUI();
    }, 'active-gs');
    renderGrid('grid-extras', EXTRAS, (i) => state.selExtras.includes(i), (e) => {
      if (state.selExtras.includes(e)) state.selExtras = state.selExtras.filter(x => x !== e);
      else state.selExtras.push(e); actualizarUI();
    }, 'active-ex');
    renderGrid('grid-bebidas', BEBIDAS, (i) => state.selBebida === i, (b) => {
      if (state.selBebida === b) { state.selBebida = null; state.precBebida = 0; }
      else { state.selBebida = b; state.precBebida = b.includes("27") ? 27 : 25; }
      actualizarUI();
    }, 'active-bb');

    const lbl = document.getElementById('lbl-precio');
    if (!state.selPlatillo || (state.selGuisados.length === 0 && state.selPlatillo !== "Flautas (3pz)")) {
      lbl.innerText = "—";
    } else {
      lbl.innerText = `$${(calcularPrecio(state.selPlatillo, state.selGuisados) + state.precBebida).toFixed(2)}`;
    }
  }

  function agregarTodosExtras() {
    EXTRAS.forEach(ex => {
      if (!state.selExtras.includes(ex)) state.selExtras.push(ex);
    });
    actualizarUI();
  }

  function agregarItem() {
    if (!state.selPlatillo) return alert("Selecciona un platillo.");
    if (state.selGuisados.length === 0 && state.selPlatillo !== "Flautas (3pz)") return alert("Selecciona al menos un guisado o relleno.");

    let desc = [state.selGuisados.join(" + ")];
    if (state.selSalsas.length > 0) desc.push("Salsa: " + state.selSalsas.join(" y "));
    if (state.selExtras.length > 0) desc.push(state.selExtras.join(", "));
    if (state.selBebida) desc.push(state.selBebida);

    let precioBase = calcularPrecio(state.selPlatillo, state.selGuisados) + state.precBebida;

    state.itemsVenta.push({
      nombre: `${state.cantidadActual}x ${state.selPlatillo}`,
      desc: desc.filter(d => d !== "").join(" · "),
      precio: precioBase * state.cantidadActual
    });

    limpiarSeleccionActual();
    renderSidebar();
  }

  function limpiarSeleccionActual() {
    state.selPlatillo = null;
    state.selGuisados = [];
    state.selSalsas = [];
    state.selExtras = [];
    state.selBebida = null;
    state.precBebida = 0;
    state.cantidadActual = 1;
    document.getElementById('lbl-cantidad').innerText = state.cantidadActual;
    document.getElementById('hint-text').innerText = "Selecciona un platillo para ver sus reglas y precios.";
    actualizarUI();
  }

  function limpiarPedido() {
    if (confirm("¿Borrar todo el pedido actual?")) { state.itemsVenta = []; renderSidebar(); }
  }

  function renderSidebar() {
    const container = document.getElementById('sidebar-resumen');
    container.innerHTML = ''; let total = 0;
    state.itemsVenta.forEach((it, idx) => {
      total += it.precio;
      const div = document.createElement('div'); div.className = 'cart-item';
      div.innerHTML = `<div class="cart-item-details"><span class="cart-item-title">${it.nombre}</span><span class="cart-item-desc">${it.desc}</span></div>
                       <div style="text-align:right"><span class="cart-item-price">$${it.precio.toFixed(2)}</span><br><button class="btn-del" onclick="state.itemsVenta.splice(${idx},1);renderSidebar()">✖</button></div>`;
      container.appendChild(div);
    });
    document.getElementById('lbl-side-total').innerText = `$${total.toFixed(2)}`;
    document.getElementById('lbl-side-count').innerText = state.itemsVenta.length + " renglones en caja";
    container.scrollTop = container.scrollHeight;
  }

  function guardarVenta() {
    if (state.itemsVenta.length === 0) return;
    state.numVenta++;
    let totalVenta = state.itemsVenta.reduce((a, b) => a + b.precio, 0);
    let texto = `---- Cliente #${state.numVenta}  ---  $${totalVenta.toFixed(2)}\n`;
    state.itemsVenta.forEach(i => texto += ` * ${i.nombre}: $${i.precio.toFixed(2)}\n   └ ${i.desc}\n`);
    state.historial.push({ texto, total: totalVenta });
    state.itemsVenta = []; renderSidebar();
  }

  function abrirModalCorte() {
    document.getElementById('modal-corte').style.display = 'flex';
    let totalDia = state.historial.reduce((a, b) => a + b.total, 0);
    document.getElementById('lbl-metricas').innerText = `Ventas cobradas: ${state.historial.length} | Total acumulado: $${totalDia.toFixed(2)}`;
    document.getElementById('area-historial').innerText = state.historial.length ? state.historial.map(h => h.texto).reverse().join("\n") : "La caja está en $0.00. Sin ventas aún.";
  }

  function cerrarModalCorte() { document.getElementById('modal-corte').style.display = 'none'; }

  function hacerCorte() {
    if (confirm("¿Cerrar caja y borrar el historial del día? Esto no se puede deshacer.")) {
      state.historial = []; state.numVenta = 0; cerrarModalCorte();
    }
  }

  actualizarUI();
</script>
</body>
</html>
